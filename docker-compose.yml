version: '3.8'

services:
  polyplinko-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GAME_CONTRACT_ADDRESS=${NEXT_PUBLIC_GAME_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_PPL_CONTRACT_ADDRESS=${NEXT_PUBLIC_PPL_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_NETWORK_ID=${NEXT_PUBLIC_NETWORK_ID:-137}
    restart: unless-stopped
    networks:
      - polyplinko-network
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - polyplinko-web
    restart: unless-stopped
    networks:
      - polyplinko-network
    deploy:
      placement:
        constraints:
          - node.role == manager

networks:
  polyplinko-network:
    driver: overlay
