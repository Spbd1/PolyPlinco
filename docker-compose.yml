services:
  polyplinko-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GAME_CONTRACT_ADDRESS: ${NEXT_PUBLIC_GAME_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000001}
        NEXT_PUBLIC_PPL_CONTRACT_ADDRESS: ${NEXT_PUBLIC_PPL_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000002}
        NEXT_PUBLIC_NETWORK_ID: ${NEXT_PUBLIC_NETWORK_ID:-137}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
    ports:
      - "${POLYPLINKO_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_GAME_CONTRACT_ADDRESS=${NEXT_PUBLIC_GAME_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_PPL_CONTRACT_ADDRESS=${NEXT_PUBLIC_PPL_CONTRACT_ADDRESS}
      - NEXT_PUBLIC_NETWORK_ID=${NEXT_PUBLIC_NETWORK_ID:-137}
      - NEXT_PUBLIC_RPC_URL=${NEXT_PUBLIC_RPC_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - polyplinko-network

  nginx:
    profiles: ["production"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - polyplinko-web
    restart: unless-stopped
    networks:
      - polyplinko-network

networks:
  polyplinko-network:
    driver: bridge
