name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies (mandatory)
      run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile
    
    - name: Run production dependency audit (mandatory)
      run: pnpm audit --prod --audit-level=high
    
    - name: Run Snyk security scan (optional external)
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true
    
    - name: Run ESLint security rules (mandatory)
      run: pnpm exec eslint . --max-warnings 0
    
    - name: Check for secrets (mandatory)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

  contract-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies (mandatory)
      run: corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile
    
    - name: Compile contracts
      run: npx hardhat compile
    
    - name: Run Slither (optional external scanner)
      uses: crytic/slither-action@v0.3.0
      with:
        target: 'contracts/'
      continue-on-error: true
    
    - name: Run Mythril (optional external scanner)
      run: |
        pip3 install mythril
        myth analyze contracts/PolyPlinkoGame.sol --solc-json remappings.json
      continue-on-error: true
