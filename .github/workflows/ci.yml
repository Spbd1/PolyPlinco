name: validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:compile
      - run: pnpm contracts:test
      - run: pnpm abi:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: docker build --build-arg NEXT_PUBLIC_GAME_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000001 --build-arg NEXT_PUBLIC_PPL_CONTRACT_ADDRESS=0x0000000000000000000000000000000000000002 .
