services:
  polyplinko-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: public-readonly
        NEXT_PUBLIC_GAME_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
        NEXT_PUBLIC_PPL_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
        NEXT_PUBLIC_NETWORK_ID: ${VPS_NETWORK_ID:-137}
        NEXT_PUBLIC_RPC_URL: ${VPS_PUBLIC_RPC_URL:-}
        NEXT_PUBLIC_PAID_MODE_ENABLED: "false"
    environment:
      NODE_ENV: production
      APP_ENV: public-readonly
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_GAME_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
      NEXT_PUBLIC_PPL_CONTRACT_ADDRESS: 0x0000000000000000000000000000000000000000
      NEXT_PUBLIC_NETWORK_ID: ${VPS_NETWORK_ID:-137}
      NEXT_PUBLIC_RPC_URL: ${VPS_PUBLIC_RPC_URL:-}
      NEXT_PUBLIC_PAID_MODE_ENABLED: "false"
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]

  reverse-proxy:
    image: nginx:1.27-alpine
    user: "101:101"
    entrypoint: [nginx, -g, daemon off;]
    ports:
      - "80:8080"
      - "443:8443"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=700
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      polyplinko-web:
        condition: service_healthy
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks: [internal]

networks:
  internal:
    driver: bridge
